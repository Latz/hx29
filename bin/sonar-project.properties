sonar.host.url=https://sonarcloud.io
sonar.organization=latz-1
sonar.projectKey=Latz_hx29
sonar.projectName=hx29
sonar.qualitygate.wait=true

# JavaScript/TypeScript analyzer settings
sonar.javascript.detectBundles=false
sonar.javascript.node.maxspace=2048

# Source directories
sonar.sources=functions.php,inc,src,theme.json,style.css

# Encoding
sonar.sourceEncoding=UTF-8

# Coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusions
sonar.exclusions=\
  **/node_modules/**,\
  **/build/**,\
  **/coverage/**,\
  **/*.min.js,\
  **/*.woff2,\
  **/*.ttf

# WordPress function names use snake_case per WP coding standards, not the
# camelCase php:S100 expects.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=php:S100
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.php
